name: Release APK

# 推送 v* 标签即发布；workflow_dispatch 用于重发或补发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.2.0，不要带 v）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          set -e
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            # 不同镜像的 Android 37 包名可能是 android-37 或 android-37.0，两个都尝试；
            # 失败也继续，后续由 AGP 的自动下载兜底。
            for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;36.0.0"; do
              "$SDKMANAGER" "$pkg" > /dev/null || echo "跳过 $pkg（可能已安装或源中不存在）"
            done
          else
            echo "未找到 cmdline-tools，依赖 runner 预装 SDK 与 AGP 自动下载"
          fi

      - name: Resolve version and notes
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version }}"
            TAG="v${VERSION_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本号格式不正确：$VERSION_NAME" >&2
            exit 1
          fi

          # 用“UTC 分钟数”作为 versionCode：单调递增、远小于 int 上限，且不依赖 run_number。
          VERSION_CODE=$(( $(date -u +%s) / 60 ))

          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES=$(git log --no-merges --pretty=format:'- %s' "${PREVIOUS_TAG}..${TAG}")
            else
              NOTES=$(git log --no-merges --pretty=format:'- %s' -20 "${TAG}")
            fi
          else
            NOTES=$(git log --no-merges --pretty=format:'- %s' -20)
          fi
          NOTES="${NOTES:0:2000}"

          {
            echo "tag=${TAG}"
            echo "name=${VERSION_NAME}"
            echo "code=${VERSION_CODE}"
            echo "notes<<__NOTES_EOF__"
            echo "${NOTES}"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "发布 ${TAG}（versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}）"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "缺少 SIGNING_KEYSTORE_BASE64 secret，无法生成可覆盖升级的正式包" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify and rename APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "没有找到 release APK" >&2
            exit 1
          fi

          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "找不到 apksigner，无法校验签名" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | head -n 5

          NAME="Video2Gif-${VERSION_NAME}.apk"
          cp "$APK" "$NAME"
          SHA256=$(sha256sum "$NAME" | cut -d ' ' -f 1)
          SIZE=$(stat -c %s "$NAME")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Write latest.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          name = os.environ["VERSION_NAME"]
          tag = os.environ["VERSION_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases"
          data = {
              "schemaVersion": 1,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": name,
              "tag": tag,
              "apkName": os.environ["APK_NAME"],
              "apkUrl": f"{base}/download/{tag}/{os.environ['APK_NAME']}",
              "apkSizeBytes": int(os.environ["APK_SIZE"]),
              "sha256": os.environ["APK_SHA256"],
              "releaseUrl": f"{base}/tag/{tag}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "notes": os.environ.get("NOTES", ""),
          }
          pathlib.Path("latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(pathlib.Path("latest.json").read_text(encoding="utf-8"))
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video2Gif-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Video2Gif ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.notes }}
          files: |
            ${{ steps.apk.outputs.name }}
            latest.json
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
